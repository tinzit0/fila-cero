<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071710"><title>Nueva contraseña — Fila Cero</title><link rel="stylesheet" href="styles.css">  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head><body class="auth-body"><header class="topbar topbar-dark"><a class="brand brand-light" href="index.html"><span class="brand-mark">0</span><span class="brand-copy"><strong>FILA CERO</strong><small>Seguridad</small></span></a></header><main class="auth-main single-auth"><section class="auth-visual"><span class="eyebrow light">SEGURIDAD</span><h1>Crea una nueva<br><em>contraseña.</em></h1></section><section class="auth-card"><h2>Actualizar contraseña</h2><form id="newPasswordForm" class="auth-form"><label>Nueva contraseña<input id="newPassword" type="password" minlength="8" required autocomplete="new-password"></label><label>Repetir contraseña<input id="newPassword2" type="password" minlength="8" required autocomplete="new-password"></label><button class="btn btn-accent btn-full" type="submit">Guardar nueva contraseña</button></form><div id="passwordMessage" class="auth-message hidden"></div></section></main><footer class="site-footer site-footer-v12" data-fc-footer="true"></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script><script src="auth.js"></script><script src="app.js"></script><script src="features-v013.js"></script><script src="calendar.js"></script><script src="pwa.js"></script><script src="features-v014.js"></script><script>newPasswordForm.addEventListener('submit',async e=>{e.preventDefault();if(newPassword.value!==newPassword2.value){passwordMessage.className='auth-message auth-message-error';passwordMessage.textContent='Las contraseñas no coinciden.';return}const b=e.submitter;b.disabled=true;try{await FCAUTH.updatePassword(newPassword.value);passwordMessage.className='auth-message auth-message-success';passwordMessage.textContent='Contraseña actualizada. Ya puedes volver a iniciar sesión.';setTimeout(()=>location.href='login.html',1800)}catch(err){passwordMessage.className='auth-message auth-message-error';passwordMessage.textContent=err.message||String(err)}finally{b.disabled=false}})</script></body></html>
