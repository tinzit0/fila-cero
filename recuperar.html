<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071710"><title>Recuperar contraseña — Fila Cero</title><link rel="stylesheet" href="styles.css"></head><body class="auth-body"><header class="topbar topbar-dark"><a class="brand brand-light" href="index.html"><span class="brand-mark">0</span><span class="brand-copy"><strong>FILA CERO</strong><small>Seguridad</small></span></a><nav><a href="login.html">Volver al acceso</a></nav></header><main class="auth-main single-auth"><section class="auth-visual"><span class="eyebrow light">RECUPERACIÓN</span><h1>Vuelve a entrar<br><em>sin perder tu cuenta.</em></h1><p>Te enviaremos un enlace seguro para definir una nueva contraseña.</p></section><section class="auth-card"><span class="eyebrow">CONTRASEÑA</span><h2>Recuperar acceso</h2><form id="resetForm" class="auth-form"><label>Correo electrónico<input id="resetEmail" type="email" required autocomplete="email" placeholder="tu@correo.cl"></label><button class="btn btn-accent btn-full" type="submit">Enviar enlace de recuperación →</button></form><div id="resetMessage" class="auth-message hidden" aria-live="polite"></div></section></main><footer class="site-footer site-footer-v12" data-fc-footer="true"></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script><script src="auth.js"></script><script src="app.js"></script><script src="features-v013.js"></script><script>resetForm.addEventListener('submit',async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;b.textContent='Enviando…';try{await FCAUTH.sendPasswordReset(resetEmail.value);resetMessage.className='auth-message auth-message-success';resetMessage.textContent='Te enviamos un enlace de recuperación. Revisa tu correo y también la carpeta Spam.'}catch(err){resetMessage.className='auth-message auth-message-error';resetMessage.textContent=err.message||String(err)}finally{b.disabled=false;b.textContent='Enviar enlace de recuperación →'}})</script></body></html>
